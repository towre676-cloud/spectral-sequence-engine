name: Exact spectral sequence regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile modules
        run: python -m compileall -q filtered_complex.py spectral_sequence.py morphisms.py integral.py exact_couple.py multiplicative.py bockstein.py bicomplex.py graded_couple.py simplicial_maps.py research
      - name: Execute test suite
        run: python -m unittest discover -s tests -v
      - name: Replay higher differential receipt
        run: |
          python spectral_sequence.py --example d3 --certificate /tmp/d3-receipt.json
          python spectral_sequence.py --replay /tmp/d3-receipt.json
      - name: Geometric Hopf fibration four-field replay
        run: python -m research.hopf_fibration
      - name: Geometric Hopf, product and twisted mapping-torus benchmarks
        run: python -m research.geometric_benchmarks
      - name: Seeded 1000-map geometric audit
        run: python -m research.random_geometry_audit --trials 1000 --seed 20261106
      - name: JSON simplicial-map input and replay
        run: |
          python -m simplicial_maps examples/hopf_simplicial_map.json --prime 3 --certificate /tmp/hopf-map-replay.json
          python -m simplicial_maps --replay /tmp/hopf-map-replay.json
