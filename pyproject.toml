[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-sequence-engine"
version = "0.5.0"
description = "Exact spectral sequences from finite simplicial maps, twisted mapping tori and lifted Bocksteins"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Spectral Sequence Engine contributors"}]
dependencies = []

[project.scripts]
spectral-sequence = "spectral_sequence:main"
spectral-simplicial-map = "simplicial_maps:main"

[tool.setuptools]
py-modules = ["spectral_sequence", "filtered_complex", "morphisms", "multiplicative", "exact_couple", "integral", "bockstein", "bicomplex", "graded_couple", "simplicial_maps"]
packages = ["research"]
